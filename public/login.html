<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ReadSync</title>

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0f172a">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #020617;
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Shooting Stars Container */
        .shooting-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            transform: rotate(0deg);
        }

        /* Static Twinkling Stars Background */
        .star-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 4s ease-in-out infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Shooting Star with Enhanced Trail */
        .shooting-star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(147, 197, 253, 0.1),
                0 0 0 8px rgba(147, 197, 253, 0.1),
                0 0 20px rgba(147, 197, 253, 0.3);
            left: initial;
            z-index: -1;
            opacity: 0;
        }

        .shooting-star::before {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 300px;
            height: 1px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 1), rgba(147, 197, 253, 0.8), transparent);
        }

        /* Shooting Motion - Top Right to Bottom Left */
        @keyframes shootingStar {
            0% {
                transform: rotate(315deg) translateX(0);
                opacity: 1;
            }

            70% {
                opacity: 1;
            }

            100% {
                transform: rotate(315deg) translateX(-1000px);
                opacity: 0;
            }
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: rgba(15, 23, 42, 0.98);
            border-radius: 12px;
            border: 1px solid #1e293b;
            box-shadow: 0 18px 55px rgba(0, 0, 0, 0.65);
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .logo p {
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: #9ca3af;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            color: #e5e7eb;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 12px 24px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-login:hover {
            background: #5558e3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            background: #374151;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 24px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #6b7280;
            font-size: 0.875rem;
        }
    </style>
</head>

<body>
    <!-- Static Twinkling Stars Background -->
    <div class="star-field" id="starField"></div>

    <!-- Shooting Stars Container -->
    <div class="shooting-stars" id="shootingStars"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <h1>📚 ReadSync</h1>
                <p>Sign in to continue</p>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    Sign In
                </button>
            </form>

            <div class="footer">
                ReadSync &copy; 2026
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Get form data
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Clear previous errors
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';

            // Disable button and show loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span> Signing in...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Login successful - redirect to home
                    window.location.href = '/';
                } else {
                    // Show error
                    errorMessage.textContent = data.error || 'Login failed';
                    errorMessage.classList.add('show');

                    // Re-enable button
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = 'Network error. Please try again.';
                errorMessage.classList.add('show');

                // Re-enable button
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        // Auto-focus username field
        document.getElementById('username').focus();

        // Utility function for random number generation
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        // Seeded random number generator for consistent positions
        function seededRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        // Generate static twinkling stars background with consistent positions
        function generateStarField() {
            const starField = document.getElementById('starField');
            const numStars = 150;
            let seed = 12345; // Fixed seed for consistent positions

            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';

                // Consistent positioning using seeded random
                star.style.top = `${seededRandom(seed++) * 100}%`;
                star.style.left = `${seededRandom(seed++) * 100}%`;

                // Consistent animation delay
                star.style.animationDelay = `${seededRandom(seed++) * 4}s`;

                // Consistent animation duration
                star.style.animationDuration = `${3 + seededRandom(seed++) * 4}s`;

                // Consistent size variation
                const size = seededRandom(seed++) < 0.5 ? 1 : 2;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;

                // Add twinkle animation to some stars consistently
                if (seededRandom(seed++) < 0.3) {
                    const twinkleTypes = ['twinkle'];
                    star.style.animation = `${twinkleTypes[0]} ${5 + seededRandom(seed++) * 3}s infinite`;
                }

                starField.appendChild(star);
            }
        }

        // Generate shooting stars with dynamic repositioning
        function generateShootingStars() {
            const shootingStarsContainer = document.getElementById('shootingStars');
            const numShootingStars = 6;

            for (let i = 0; i < numShootingStars; i++) {
                const shootingStar = document.createElement('div');
                shootingStar.className = 'shooting-star';

                // Position randomly in top-right area
                if (Math.random() < 0.75) {
                    shootingStar.style.top = '-4px'; // Hidden off screen
                    shootingStar.style.right = `${random(0, 90)}%`;
                } else {
                    shootingStar.style.top = `${random(0, 50)}%`;
                    shootingStar.style.right = '-4px'; // Hidden off screen
                }

                // Random animation duration and delay
                shootingStar.style.animation = `shootingStar ${Math.floor(Math.random() * 2) + 2}s linear`;
                shootingStar.style.animationDelay = `${Math.floor(Math.random() * 8)}s`;

                shootingStarsContainer.appendChild(shootingStar);

                // Reposition and restart animation when it ends
                shootingStar.addEventListener('animationend', () => {
                    // Reposition randomly
                    if (Math.random() < 0.75) {
                        shootingStar.style.top = '-4px';
                        shootingStar.style.right = `${random(0, 90)}%`;
                    } else {
                        shootingStar.style.top = `${random(0, 50)}%`;
                        shootingStar.style.right = '-4px';
                    }

                    // Reset animation
                    shootingStar.style.animation = 'none';
                    void shootingStar.offsetWidth; // Trigger reflow
                    shootingStar.style.animation = `shootingStar ${Math.floor(Math.random() * 2) + 2}s linear`;
                    shootingStar.style.animationDelay = `${Math.random() * 2}s`;
                });
            }
        }

        // Initialize on page load
        generateStarField();
        generateShootingStars();
    </script>
</body>

</html>
