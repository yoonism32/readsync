name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm ci --prefix frontend --legacy-peer-deps
      - run: npm ci --prefix userscript --legacy-peer-deps

      - name: Verify application and userscript builds
        env:
          API_KEY: ${{ secrets.API_KEY }}
          USERSCRIPT_UPDATE_TOKEN: ${{ secrets.USERSCRIPT_UPDATE_TOKEN }}
        run: npm run verify
